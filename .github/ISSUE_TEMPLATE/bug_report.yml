name: Bug report
description: Report a reproducible StudioPulse defect
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the defect and its visible effect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the exact steps and active preview mode.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: Editor or Release version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Attach relevant Unreal logs or screenshots.